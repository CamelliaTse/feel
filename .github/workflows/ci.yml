name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 ruff
        run: pip install ruff

      - name: Ruff 检查
        run: ruff check feel

  test:
    name: 冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法检查
        run: python -m py_compile feel

      - name: 帮助命令与别名
        run: |
          python feel help
          python feel --help
          python feel -h

      - name: 版本命令与别名
        run: |
          python feel version
          python feel -v

      - name: 直接记录
        run: python feel "CI 冒烟测试"

      - name: 查看日志
        run: python feel list

      - name: list 别名与选项
        run: |
          python feel ls
          python feel ls -a
          python feel ls -n 1

      - name: 验证日志格式（v2.1.0 起主日志为 log.feel）
        run: |
          LOG_FILE="${XDG_DATA_HOME:-$HOME/.local/share}/feel/log.feel"
          test -f "$LOG_FILE" || { echo "日志文件不存在"; exit 1; }
          LINE=$(tail -1 "$LOG_FILE")
          # 格式: <unix_ts> <YYYY-MM-DD HH:MM> <feeling>
          echo "$LINE" | grep -qE '^[0-9]+ [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} ' || {
            echo "日志格式不正确: $LINE"
            exit 1
          }

      - name: 英文环境
        run: LANG=en_US.UTF-8 python feel help

  homebrew-check:
    name: Homebrew Formula 轻量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 验证 Formula Ruby 语法
        run: ruby -c Formula/feel.rb

      - name: 验证 Formula 结构完整性
        run: |
          grep -q 'class Feel < Formula' Formula/feel.rb
          grep -q 'desc ' Formula/feel.rb
          grep -q 'homepage ' Formula/feel.rb
          grep -q 'url ' Formula/feel.rb
          grep -q 'sha256 ' Formula/feel.rb
          grep -q 'license ' Formula/feel.rb
          grep -q 'def install' Formula/feel.rb
          grep -q 'test do' Formula/feel.rb
          echo "Formula 结构完整"

      - name: 验证 sha256 不为占位符
        run: |
          if grep -q 'sha256 "SKIP"' Formula/feel.rb || grep -q 'sha256 "TODO' Formula/feel.rb; then
            echo "sha256 仍为占位符，请更新为真实值"
            exit 1
          fi
          echo "sha256 已设置"

  version-consistency:
    name: 版本一致性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查版本号一致性（脚本 / PKGBUILD / Formula / README / man page）
        run: |
          SCRIPT_VER=$(grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+' feel | head -1)
          PKGBUILD_VER=$(grep -oP 'pkgver=\K[0-9]+\.[0-9]+\.[0-9]+' PKGBUILD)
          FORMULA_VER=$(grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+' Formula/feel.rb | head -1)
          README_VER=$(grep -oP '# feel v\K[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1)
          MAN_VER=$(grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+' feel.1 | head -1)

          echo "feel 脚本: $SCRIPT_VER"
          echo "PKGBUILD:  $PKGBUILD_VER"
          echo "Formula:   $FORMULA_VER"
          echo "README:    $README_VER"
          echo "man page:  $MAN_VER"

          fail=0
          for name in PKGBUILD_VER FORMULA_VER README_VER MAN_VER; do
            if [ "${!name}" != "$SCRIPT_VER" ]; then
              echo "版本不一致: $name=${!name} != feel=$SCRIPT_VER"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "所有版本号一致: $SCRIPT_VER"
